<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Eveil & Ihsan</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color, #f4f7f6);
            font-family: 'Roboto', sans-serif;
            text-align: center;
        }
        .offline-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .offline-icon {
            font-size: 64px;
            color: #9e9e9e;
            margin-bottom: 20px;
        }
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-retry {
            background-color: var(--primary-color, #0056b3);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            gap: 8px;
        }
        .btn-retry:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img src="/uploads/logo/logo.png" alt="Logo Eveil & Ihsan" class="logo">
        <div class="material-icons offline-icon">wifi_off</div>
        <h1>Vous êtes hors ligne</h1>
        <p>Veuillez vérifier votre connexion internet pour accéder au portail Eveil & Ihsan.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <span class="material-icons">refresh</span>
            Réessayer
        </button>
    </div>
</body>
</html>
