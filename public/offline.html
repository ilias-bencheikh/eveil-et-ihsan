<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Eveil & Ihsan</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--md-sys-color-background, #f8f9ff);
            color: var(--md-sys-color-on-background, #191c20);
            font-family: 'Roboto', sans-serif;
            text-align: center;
        }
        
        .offline-container {
            background-color: var(--md-sys-color-surface-container-lowest, #ffffff);
            padding: var(--spacing-2xl, 48px) var(--spacing-lg, 24px);
            border-radius: var(--md-sys-shape-corner-extra-large, 28px);
            box-shadow: var(--md-sys-elevation-3, 0 4px 8px 3px rgba(0, 0, 0, 0.15));
            max-width: 420px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn var(--md-sys-motion-duration-medium4, 400ms) var(--md-sys-motion-easing-emphasized, cubic-bezier(0.2, 0, 0, 1));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 140px;
            margin-bottom: var(--spacing-lg, 24px);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            border-radius: var(--md-sys-shape-corner-full, 9999px);
            background-color: var(--md-sys-color-error-container, #ffdad6);
            color: var(--md-sys-color-on-error-container, #410002);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-lg, 24px);
        }

        .offline-icon {
            font-size: 40px;
        }

        h1 {
            font: var(--md-sys-typescale-headline-small);
            color: var(--md-sys-color-on-surface, #191c20);
            margin: 0 0 var(--spacing-sm, 8px) 0;
        }

        p {
            font: var(--md-sys-typescale-body-large);
            color: var(--md-sys-color-on-surface-variant, #43474e);
            margin: 0 0 var(--spacing-xl, 32px) 0;
            line-height: 1.5;
        }

        .btn-retry {
            background-color: var(--md-sys-color-primary, #1e5aa8);
            color: var(--md-sys-color-on-primary, #ffffff);
            border: none;
            padding: 0 var(--spacing-lg, 24px);
            height: 40px;
            border-radius: var(--md-sys-shape-corner-full, 9999px);
            font: var(--md-sys-typescale-label-large);
            cursor: pointer;
            transition: background-color var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard),
                        box-shadow var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard),
                        transform var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--md-sys-elevation-1);
        }

        .btn-retry:hover {
            background-color: var(--md-sys-color-primary-container, #d4e3ff);
            color: var(--md-sys-color-on-primary-container, #001c3a);
            box-shadow: var(--md-sys-elevation-2);
        }

        .btn-retry:active {
            transform: scale(0.98);
        }
        
        .btn-retry .material-icons {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img src="/uploads/logo/logo.png" alt="Logo Eveil & Ihsan" class="logo" onerror="this.style.display='none'">
        
        <div class="icon-container">
            <span class="material-icons offline-icon">wifi_off</span>
        </div>
        
        <h1>Connexion perdue</h1>
        <p>Il semble que vous soyez hors ligne. Veuillez vérifier votre connexion internet pour accéder au portail Eveil & Ihsan.</p>
        
        <button class="btn-retry" onclick="window.location.reload()">
            <span class="material-icons">refresh</span>
            Réessayer
        </button>
    </div>
</body>
</html>
