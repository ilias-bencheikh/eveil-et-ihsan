<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - Gestion École</title>
    <script src="custom-modals.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #1e3a5f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }

        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-header h1 {
            color: #1e3a5f;
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .reset-header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.2s;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #5568d3;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .btn-reset:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            padding-left: 5px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>🔒 Nouveau mot de passe</h1>
            <p>Créez votre nouveau mot de passe</p>
        </div>

        <div id="loading" class="loading">
            <p>⏳ Vérification du lien...</p>
        </div>

        <div id="resetForm" style="display: none;">
            <div id="alert" class="alert"></div>

            <form id="passwordForm">
                <div class="form-group">
                    <label>Nouveau mot de passe:</label>
                    <input type="password" id="password" required placeholder="••••••••" minlength="6">
                    <div class="password-requirements">
                        Minimum 6 caractères
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirmer le mot de passe:</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••" minlength="6">
                </div>

                <button type="submit" class="btn-reset" id="submitBtn">Réinitialiser le mot de passe</button>
            </form>

            <div class="back-link">
                <a href="login.html">← Retour à la connexion</a>
            </div>
        </div>

        <div id="error" style="display: none; text-align: center;">
            <div class="alert alert-error" style="display: block;">
                ❌ Le lien de réinitialisation est invalide ou a expiré.
            </div>
            <div class="back-link">
                <a href="login.html">← Retour à la connexion</a>
            </div>
        </div>
    </div>

    <script>
        // URL de base de l'API
        const API_URL = `http://${window.location.hostname}:3000/api`;

        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Vérifier le token au chargement
        if (!token) {
            showError();
        } else {
            checkToken();
        }

        async function checkToken() {
            try {
                const response = await fetch(`${API_URL}/auth/check-reset-token/${token}`);
                const data = await response.json();

                if (response.ok && data.valid) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('resetForm').style.display = 'block';
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Erreur:', error);
                showError();
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // Gestion de la soumission du formulaire
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Réinitialisation en cours...';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✅ Mot de passe réinitialisé avec succès! Redirection...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Erreur lors de la réinitialisation', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Réinitialiser le mot de passe';
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('Erreur de connexion au serveur', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Réinitialiser le mot de passe';
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
