<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion École</title>
    <script src="custom-modals.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #1e3a5f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #1e3a5f;
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .login-header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.2s;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #152d4a;
            box-shadow: 0 3px 10px rgba(30, 58, 95, 0.3);
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .info-box {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 25px;
            font-size: 13px;
            color: #004085;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎓 Connexion</h1>
            <p>Système de Gestion Scolaire</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required placeholder="votre.email@example.com">
            </div>

            <div class="form-group">
                <label>Mot de passe:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="#" id="forgotPasswordLink" style="color: #667eea; text-decoration: none; font-size: 0.9em;">Mot de passe oublié ?</a>
        </div>

        <div class="info-box">
            <strong>Comptes de démonstration:</strong>
            <div style="margin-top: 5px; line-height: 1.6;">
                <strong>Admin:</strong> admin@ecole.fr<br>
                <strong>Directeur:</strong> directeur@ecole.fr<br>
                <strong>Secrétariat:</strong> secretariat@ecole.fr<br>
                <strong>Professeur:</strong> prof@ecole.fr<br>
                <strong>Élève:</strong> eleve@ecole.fr<br>
                <em style="font-size: 11px; display: block; margin-top: 5px;">Mot de passe: password</em>
            </div>
        </div>
    </div>

    <script>
        // Nettoyer les anciennes sessions au chargement de la page de connexion
        localStorage.clear();

        // URL de base de l'API - Détection automatique de l'hôte
        const API_URL = `http://${window.location.hostname}:3000/api`;

        // Gestion de la soumission du formulaire
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Stocker les informations de session
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    
                    showAlert('Connexion réussie! Redirection...', 'success');
                    
                    // Rediriger vers la page appropriée
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showAlert(data.message || 'Identifiants incorrects', 'error');
                }
            } catch (error) {
                console.error('Erreur de connexion:', error);
                showAlert('Erreur de connexion. Vérifiez que le serveur est démarré.', 'error');
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }

        // Gestion du lien "Mot de passe oublié"
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            
            showCustomPrompt('Entrez votre adresse email pour réinitialiser votre mot de passe:', '', async (email) => {
                if (!email) return;
                
                try {
                    const response = await fetch(`${API_URL}/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showAlert('Un email de réinitialisation a été envoyé si cette adresse existe.', 'success');
                    } else {
                        showAlert(data.error || 'Erreur lors de l\'envoi de l\'email', 'error');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    showAlert('Erreur de connexion au serveur', 'error');
                }
            }, null, 'email');
        });
    </script>
</body>
</html>
